<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta
    name="theme-color"
    content="#202124">

  <title>Daily Dispatch Video</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
    }

    .title {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      margin-top: 20px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
    }

    .date-label {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .date {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .camera-box {
      width: 100%;
      background: #000000;
      border-radius: 15px;
      overflow: hidden;
      display: none;
    }

    #camera {
      display: block;
      width: 100%;
      height: auto;
      min-height: 250px;
      object-fit: cover;
      background: #000000;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 19px 15px;
      margin-top: 18px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .start-button {
      background: #202124;
      color: #ffffff;
    }

    .stop-button {
      background: #d93025;
      color: #ffffff;
    }

    .status {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      color: #666;
      font-size: 15px;
      line-height: 1.4;
    }

    .success {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: #e6f4ea;
      color: #137333;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #fce8e6;
      color: #c5221f;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>

  <main class="app">

    <div class="title">
      🚚 DAILY DISPATCH VIDEO
    </div>

    <div class="subtitle">
      Before Dispatch Quality Video
    </div>


    <section class="card">

      <div class="date-label">
        Today's Date
      </div>

      <div
        id="date"
        class="date">
        Loading...
      </div>


      <!-- CAMERA -->

      <div
        id="cameraBox"
        class="camera-box">

        <video
          id="camera"
          autoplay
          muted
          playsinline>
        </video>

      </div>


      <!-- START -->

      <button
        id="startButton"
        class="button start-button"
        type="button">

        🎥 START RECORDING

      </button>


      <!-- STOP -->

      <button
        id="stopButton"
        class="button stop-button hidden"
        type="button">

        ⏹ STOP

      </button>


      <!-- STATUS -->

      <div
        id="status"
        class="status">
      </div>


      <!-- SUCCESS -->

      <div
        id="success"
        class="success">

        ✅ VIDEO SENT

      </div>


      <!-- ERROR -->

      <div
        id="error"
        class="error">
      </div>

    </section>

  </main>


<script>


/************************************************************
 * CONFIGURATION
 ************************************************************/


/*
 * Your new Apps Script Gateway.
 */
const GATEWAY_URL =
  "https://script.google.com/macros/s/AKfycbyHd_Zt95-vtq3ysVhmAQ8o9jvdyezRfIMhcWyF5GW1-vf-pCmefSQFJF7X1valNn1j/exec";


/*
 * Hidden maximum recording time.
 *
 * Driver does NOT see this.
 */
const MAX_RECORDING_SECONDS = 40;


/*
 * Camera resolution.
 *
 * 1280 x 720 keeps file size reasonable
 * while retaining useful dispatch-video quality.
 */
const CAMERA_WIDTH = 1280;

const CAMERA_HEIGHT = 720;


/************************************************************
 * RUNTIME VARIABLES
 ************************************************************/


let stream = null;

let recorder = null;

let chunks = [];

let recordingStartedAt = 0;

let safetyTimer = null;

let isRecording = false;

let isUploading = false;


/************************************************************
 * PAGE INITIALIZATION
 ************************************************************/


document.addEventListener(
  "DOMContentLoaded",
  initializeApp
);


function initializeApp() {

  /*
   * Show today's date.
   */
  document
    .getElementById("date")
    .innerText =
    getTodayDate();


  /*
   * Start button.
   */
  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      startRecording
    );


  /*
   * Stop button.
   */
  document
    .getElementById("stopButton")
    .addEventListener(
      "click",
      stopRecording
    );

}


/************************************************************
 * TODAY'S DATE
 ************************************************************/


function getTodayDate() {

  return new Date().toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}


/************************************************************
 * START RECORDING
 ************************************************************/


async function startRecording() {

  /*
   * Prevent double tap.
   */
  if (
    isRecording ||
    isUploading
  ) {

    return;

  }


  clearError();

  hideSuccess();


  setStatus(
    "Opening camera..."
  );


  try {

    /*
     * CAMERA ONLY.
     *
     * IMPORTANT:
     *
     * audio:false
     *
     * means microphone is NOT requested.
     */
    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: CAMERA_WIDTH
          },

          height: {
            ideal: CAMERA_HEIGHT
          }

        },

        audio: false

      });


    /*
     * Attach camera preview.
     */
    const camera =
      document.getElementById(
        "camera"
      );


    camera.srcObject =
      stream;


    /*
     * Show camera.
     */
    document
      .getElementById("cameraBox")
      .style.display =
      "block";


    /*
     * Change buttons.
     */
    document
      .getElementById("startButton")
      .classList
      .add("hidden");


    document
      .getElementById("stopButton")
      .classList
      .remove("hidden");


    const stopButton =
      document.getElementById(
        "stopButton"
      );


    stopButton.disabled =
      false;


    stopButton.innerText =
      "⏹ STOP";


    /*
     * Prepare recording chunks.
     */
    chunks = [];


    /*
     * Find best supported video format.
     */
    const mimeType =
      getSupportedMimeType();


    /*
     * Create MediaRecorder.
     */
    if (mimeType) {

      recorder =
        new MediaRecorder(

          stream,

          {
            mimeType:
              mimeType,

            videoBitsPerSecond:
              2500000

          }

        );

    } else {

      recorder =
        new MediaRecorder(

          stream,

          {
            videoBitsPerSecond:
              2500000

          }

        );

    }


    /*
     * Receive recorded chunks.
     */
    recorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          chunks.push(
            event.data
          );

        }

      };


    /*
     * Recording error.
     */
    recorder.onerror =
      function(event) {

        console.error(
          "Recorder error:",
          event
        );


        cleanupCamera();

        resetRecordingUI();


        showError(
          "Recording failed. Please contact office."
        );

      };


    /*
     * Recording stopped.
     */
    recorder.onstop =
      function() {

        finishRecording();

      };


    /*
     * Start recording.
     *
     * Data is requested every 500 ms.
     */
    recorder.start(
      500
    );


    isRecording =
      true;


    recordingStartedAt =
      Date.now();


    setStatus(
      "Recording..."
    );


    /*
     * Hidden 40-second safety stop.
     */
    safetyTimer =
      setInterval(

        function() {

          if (!isRecording) {

            return;

          }


          const elapsed =
            (
              Date.now() -
              recordingStartedAt
            ) / 1000;


          if (
            elapsed >=
            MAX_RECORDING_SECONDS
          ) {

            stopRecording();

          }

        },

        250

      );


  } catch (error) {

    console.error(
      error
    );


    cleanupCamera();

    resetRecordingUI();


    showError(
      "Camera could not be opened. Please allow camera access."
    );

  }

}


/************************************************************
 * SUPPORTED VIDEO FORMAT
 ************************************************************/


function getSupportedMimeType() {

  const formats = [

    /*
     * Prefer MP4 when the browser supports it.
     */
    "video/mp4",

    /*
     * Otherwise use WebM.
     */
    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for (
    let i = 0;
    i < formats.length;
    i++
  ) {

    if (
      MediaRecorder.isTypeSupported(
        formats[i]
      )
    ) {

      return formats[i];

    }

  }


  return "";

}


/************************************************************
 * STOP RECORDING
 ************************************************************/


function stopRecording() {

  /*
   * Ignore if not recording.
   */
  if (
    !recorder ||
    !isRecording
  ) {

    return;

  }


  isRecording =
    false;


  /*
   * Stop safety timer.
   */
  if (safetyTimer) {

    clearInterval(
      safetyTimer
    );

    safetyTimer =
      null;

  }


  /*
   * Prevent multiple taps.
   */
  const stopButton =
    document.getElementById(
      "stopButton"
    );


  stopButton.disabled =
    true;


  stopButton.innerText =
    "⏳ PROCESSING...";


  setStatus(
    "Preparing video..."
  );


  /*
   * MediaRecorder will fire
   * onstop after final data arrives.
   */
  try {

    recorder.stop();

  } catch (error) {

    console.error(
      error
    );

    cleanupCamera();

    resetRecordingUI();

    showError(
      "Video could not be stopped."
    );

  }

}


/************************************************************
 * FINISH RECORDING
 ************************************************************/


function finishRecording() {

  /*
   * Stop camera hardware.
   */
  cleanupCamera();


  /*
   * Nothing recorded.
   */
  if (
    chunks.length === 0
  ) {

    resetRecordingUI();

    showError(
      "No video was recorded."
    );

    return;

  }


  /*
   * Create final video Blob.
   */
  const mimeType =
    chunks[0].type ||
    "video/webm";


  const blob =
    new Blob(

      chunks,

      {
        type:
          mimeType
      }

    );


  /*
   * Calculate actual duration.
   */
  const duration =
    (
      Date.now() -
      recordingStartedAt
    ) / 1000;


  /*
   * Safety validation.
   *
   * Driver does not see the limit.
   */
  if (
    duration >
    MAX_RECORDING_SECONDS + 1
  ) {

    resetRecordingUI();

    showError(
      "Video is longer than allowed."
    );

    return;

  }


  /*
   * Immediately upload.
   *
   * No preview.
   * No confirmation.
   * No submit button.
   */
  uploadVideo(
    blob,
    duration
  );

}


/************************************************************
 * UPLOAD VIDEO
 ************************************************************/


function uploadVideo(
  blob,
  duration
) {

  isUploading =
    true;


  /*
   * Hide recording controls.
   */
  document
    .getElementById("startButton")
    .classList
    .add("hidden");


  document
    .getElementById("stopButton")
    .classList
    .add("hidden");


  document
    .getElementById("cameraBox")
    .style
    .display =
    "none";


  setStatus(
    "Sending video..."
  );


  /*
   * Convert video to Base64.
   */
  const reader =
    new FileReader();


  reader.onload =
    function() {

      try {

        const dataUrl =
          reader.result;


        /*
         * Expected format:
         *
         * data:video/webm;base64,AAAA...
         */
        const commaIndex =
          dataUrl.indexOf(",");


        if (
          commaIndex === -1
        ) {

          throw new Error(
            "Invalid video data."
          );

        }


        const base64 =
          dataUrl.substring(
            commaIndex + 1
          );


        /*
         * Send JSON to Apps Script.
         *
         * text/plain avoids a browser
         * CORS preflight request.
         */
        fetch(

          GATEWAY_URL,

          {

            method:
              "POST",

            mode:
              "no-cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify({

                base64:
                  base64,

                mimeType:
                  blob.type ||
                  "video/webm",

                duration:
                  duration

              })

          }

        )

        .then(
          function() {

            /*
             * Because no-cors does not expose
             * the server response, this means
             * the browser completed the request,
             * not that the server confirmed the
             * Drive upload.
             */
            setStatus(
              "Video sent."
            );


            showSuccess(
              "✅ VIDEO SENT"
            );


            isUploading =
              false;


          }

        )

        .catch(
          function(error) {

            console.error(
              error
            );


            isUploading =
              false;


            resetRecordingUI();


            showError(
              "Video could not be sent."
            );

          }

        );


      } catch (error) {

        console.error(
          error
        );


        isUploading =
          false;


        resetRecordingUI();


        showError(
          "Video could not be prepared."
        );

      }

    };


  reader.onerror =
    function(error) {

      console.error(
        error
      );


      isUploading =
      false;


      resetRecordingUI();


      showError(
        "Video could not be read."
      );

    };


  reader.readAsDataURL(
    blob
  );

}


/************************************************************
 * CAMERA CLEANUP
 ************************************************************/


function cleanupCamera() {

  /*
   * Clear safety timer.
   */
  if (safetyTimer) {

    clearInterval(
      safetyTimer
    );

    safetyTimer =
      null;

  }


  /*
   * Stop camera tracks.
   */
  if (stream) {

    stream
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    stream =
      null;

  }


  /*
   * Remove camera source.
   */
  const camera =
    document.getElementById(
      "camera"
    );


  if (camera) {

    camera.srcObject =
      null;

  }

}


/************************************************************
 * RESET RECORDING UI
 ************************************************************/


function resetRecordingUI() {

  isRecording =
    false;


  isUploading =
    false;


  document
    .getElementById("cameraBox")
    .style
    .display =
    "none";


  document
    .getElementById("startButton")
    .classList
    .remove("hidden");


  document
    .getElementById("stopButton")
    .classList
    .add("hidden");


  const stopButton =
    document.getElementById(
      "stopButton"
    );


  stopButton.disabled =
    false;


  stopButton.innerText =
    "⏹ STOP";


  setStatus("");

}


/************************************************************
 * STATUS MESSAGE
 ************************************************************/


function setStatus(
  message
) {

  document
    .getElementById("status")
    .innerText =
    message || "";

}


/************************************************************
 * SUCCESS MESSAGE
 ************************************************************/


function showSuccess(
  message
) {

  const success =
    document.getElementById(
      "success"
    );


  success.innerText =
    message;


  success.style.display =
    "block";

}


/************************************************************
 * HIDE SUCCESS
 ************************************************************/


function hideSuccess() {

  document
    .getElementById("success")
    .style
    .display =
    "none";

}


/************************************************************
 * ERROR MESSAGE
 ************************************************************/


function showError(
  message
) {

  const error =
    document.getElementById(
      "error"
    );


  error.innerText =
    message;


  error.style.display =
    "block";

}


/************************************************************
 * CLEAR ERROR
 ************************************************************/


function clearError() {

  const error =
    document.getElementById(
      "error"
    );


  error.innerText =
    "";


  error.style.display =
    "none";

}

</script>

</body>

</html>
